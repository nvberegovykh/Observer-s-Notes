  low_probability_branches_not_pruned_without_reason: false
  pause_state_is_recoverable: false
  external_guidance_independence_checked: false
  guidance_authority_responsibility_separated: false
  loop_has_new_evidence_state_change_or_bounded_wait_reason: false
  explicit_terminal_condition_present: false
