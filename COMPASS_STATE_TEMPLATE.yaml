version: "1.2"
protocol: "Observer's Notes COMPASS"
status: "working operational template"

# Reusable external state for human- or AI-assisted research.
# Use universal technical terms here. Storytelling references belong in the volume text.
# This is not a request for private chain-of-thought; record only auditable state.

