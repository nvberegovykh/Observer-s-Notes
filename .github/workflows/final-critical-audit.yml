name: Final critical audit and reader refinement

on:
  push:
    branches: [main]
    paths: [.github/workflows/final-critical-audit.yml]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply critical audit
        run: python _critical_audit_compass.py

      - name: Commit refinement and clean temporary files
        shell: bash
        run: |
          rm -f .github/workflows/final-critical-audit.yml _critical_audit_compass.py
          git config user.name "Nikita Beregovykh"
          git config user.email "116811305+nvberegovykh@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Critical audit Compass scale inheritance and reader guidance"
          git push origin HEAD:main
