name: Final Compass format audit

on:
  push:
    branches: [main]
    paths: [.github/workflows/final-format-audit.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix final audit presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('VOL_1.2_COMPASS.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://www.jstor.org/stable/j.ctv1sfsf8d\n---\n\n## The extension in one passage', 'https://www.jstor.org/stable/j.ctv1sfsf8d\n\n---\n\n## The extension in one passage')
          anchor = '| Cultural or technical output becomes environmental input | Preserve provenance and maintenance/revision conditions where relevant; inheritance does not imply the output is beneficial. |\n'
          rows = ('| Core constraint exception justified only by the same local model | Keep the exception unresolved until an independent verifier with a named relation can test the affected condition. |\n'
                  '| Cross-scale move with no relation type | Name whether the other system is part-of, supporting, containing, regulating, observing, authorizing, or interacting before using it as evidence. |\n'
                  '| Persistent anomaly remains impossible under the local model | Review spatial, temporal, organizational, and model-class boundaries before inventing an extraordinary cause. |\n'
                  '| Snapshot treated as lineage | Preserve provenance, sequence, maintenance, and revision history when present state cannot explain inherited structure. |\n')
          if 'Core constraint exception justified only by the same local model' not in s:
              assert anchor in s
              s = s.replace(anchor, anchor + rows, 1)
          p.write_text(s, encoding='utf-8')
          assert 'j.ctv1sfsf8d\n\n---' in s
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/final-format-audit.yml
          git config user.name "Nikita Beregovykh"
          git config user.email "116811305+nvberegovykh@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish Compass critical audit presentation"
          git push origin HEAD:main
