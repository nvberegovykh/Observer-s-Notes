name: Finalize Compass structural navigation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-compass-navigation.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate structural navigation
        run: python _finalize_compass_navigation.py

      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          grep -q '^# C11 · The Channel Already on the Chart$' VOL_1.2_COMPASS.md
          grep -q '^# C12 · The Compass$' VOL_1.2_COMPASS.md
          grep -q '^navigation:$' COMPASS_STATE_TEMPLATE.yaml
          grep -q '^## Structural navigation / route memory$' COMPASS_QUICK_CARD.md
          git config user.name "Nikita Beregovykh"
          git config user.email "116811305+nvberegovykh@users.noreply.github.com"
          git add VOL_1.2_COMPASS.md COMPASS_STATE_TEMPLATE.yaml COMPASS_QUICK_CARD.md
          git commit -m "Finalize Compass structural navigation and preserved route memory"
          git push origin HEAD:main
