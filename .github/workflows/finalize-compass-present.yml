name: Finalize Compass Present

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-compass-present.yml
      - _finalize_present.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate present environment
        run: python _finalize_present.py

      - name: Commit final volume and clean temporary integration files
        run: |
          rm -f _finalize_present.py .github/workflows/finalize-compass-present.yml
          git config user.name "Nikita Beregovykh"
          git config user.email "116811305+nvberegovykh@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize Compass present environment and generative preservation"
          git push origin HEAD:main
