name: Integrate Compass communication chapter

on:
  push:
    branches:
      - vol-1.2-observers-notes-extension-1
    paths:
      - .github/workflows/compass-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vol-1.2-observers-notes-extension-1
          fetch-depth: 0

      - name: Integrate communication and coexistence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          book_path = Path('VOL_1.2_COMPASS.md')
          state_path = Path('COMPASS_STATE_TEMPLATE.yaml')
          card_path = Path('COMPASS_QUICK_CARD.md')
          book = book_path.read_text(encoding='utf-8')
          state = state_path.read_text(encoding='utf-8')
          card = card_path.read_text(encoding='utf-8')
          chapter = Path('COMMUNICATION_CHAPTER_BODY.md').read_text(encoding='utf-8').strip()
          ref_blob = Path('COMMUNICATION_REFS_APPEND.md').read_text(encoding='utf-8')
          ref_map, new_refs = ref_blob.split('@@REFERENCES@@', 1)
          state_snip = Path('COMMUNICATION_STATE_SNIPPET.yaml').read_text(encoding='utf-8')
          card_snip = Path('COMMUNICATION_CARD_SNIPPET.md').read_text(encoding='utf-8')

          old_contents = "| C6 | [The Engine at Idle](#c6) |\n| C7 | [A Voice Through the Fog](#c7) |\n| C8 | [The Return Route](#c8) |\n| C9 | [The Logbook After the Storm](#c9) |\n| C10 | [The Compass](#c10) |"
          new_contents = "| C6 | [The Engine at Idle](#c6) |\n| C7 | [The Channel Between Two Lights](#c7) |\n| C8 | [A Voice Through the Fog](#c8) |\n| C9 | [The Return Route](#c9) |\n| C10 | [The Logbook After the Storm](#c10) |\n| C11 | [The Compass](#c11) |"
          assert old_contents in book
          book = book.replace(old_contents, new_contents, 1)
          book = book.replace('C1–C10 introduce only extension-specific operational terms.', 'C1–C11 introduce only extension-specific operational terms.', 1)

          renumbers = [
              ('<a id="c10"></a>\n\n# C10 · The Compass', '<a id="c11"></a>\n\n# C11 · The Compass'),
              ('<a id="c9"></a>\n\n# C9 · The Logbook After the Storm', '<a id="c10"></a>\n\n# C10 · The Logbook After the Storm'),
              ('<a id="c8"></a>\n\n# C8 · The Return Route', '<a id="c9"></a>\n\n# C9 · The Return Route'),
              ('<a id="c7"></a>\n\n# C7 · A Voice Through the Fog', '<a id="c8"></a>\n\n# C8 · A Voice Through the Fog'),
          ]
          for old, new in renumbers:
              assert old in book
              book = book.replace(old, new, 1)

          marker = '<a id="c8"></a>\n\n# C8 · A Voice Through the Fog'
          assert marker in book
          book = book.replace(marker, '<a id="c7"></a>\n\n' + chapter + '\n\n---\n\n' + marker, 1)

          old = "Vol. 1.2 adds six explicit disciplines:\n\n1. future-space projection instead of exhaustive enumeration;\n2. interestingness as structured future leverage rather than raw uncertainty;\n3. preservation evaluation including recovery-path independence;\n4. candidate-variable promotion from real applications without allowing storytelling to become theory;\n5. patience as control of commitment timing while branch state remains recoverable;\n6. external guidance as an evidence source distinct from authority and responsibility."
          new = "Vol. 1.2 adds seven explicit disciplines:\n\n1. future-space projection instead of exhaustive enumeration;\n2. interestingness as structured future leverage rather than raw uncertainty;\n3. preservation evaluation including recovery-path independence;\n4. candidate-variable promotion from real applications without allowing storytelling to become theory;\n5. patience as control of commitment timing while branch state remains recoverable;\n6. communication as a search for constructive overlap while preserving meaningful choice;\n7. external guidance as an evidence source distinct from authority and responsibility."
          assert old in book
          book = book.replace(old, new, 1)

          old_steps = "8. choose whether to continue the active branch, probe a lower-probability branch, pause in a preserved reference state, or request external guidance;\n9. choose the smallest evidence-producing next step likely to change the model or decision;\n10. run preservation / rescue checks before consequential intervention;\n11. execute one justified step rather than the whole imagined route;\n12. compare the realized state with the projected range;\n13. update the model, preserve contradictions, and simplify irrelevant detail without deleting hard exceptions;\n14. stop when the claim is supported, the decision is robust, a hard uncertainty blocks action, an external dependency is the blocker, recovery is required, or the question must be reframed."
          new_steps = "8. choose whether to continue the active branch, probe a lower-probability branch, pause in a preserved reference state, open communication, or request external guidance;\n9. when another agent or party constrains the future space, test whether grounded communication can reveal a safe constructive overlap without removing meaningful choice;\n10. choose the smallest evidence-producing next step likely to change the model or decision;\n11. run preservation / rescue checks before consequential intervention;\n12. execute one justified step rather than the whole imagined route;\n13. compare the realized state with the projected range;\n14. update the model, preserve contradictions, and simplify irrelevant detail without deleting hard exceptions;\n15. stop when the claim is supported, the decision is robust, a hard uncertainty blocks action, an external dependency is the blocker, recovery is required, or the question must be reframed."
          assert old_steps in book
          book = book.replace(old_steps, new_steps, 1)

          book = book.replace('For a human observer, Compass externalizes state so that attention does not have to carry the entire dependency graph at once. Patience can reduce premature closure; external aids can prevent omissions; and the logbook preserves low-probability alternatives until evidence resolves them.', 'For a human observer, Compass externalizes state so that attention does not have to carry the entire dependency graph at once. Patience can reduce premature closure; communication can expose compatible futures that one side cannot see alone; external aids can prevent omissions; and the logbook preserves low-probability alternatives until evidence resolves them.', 1)
          book = book.replace('- external guidance and its independence;\n- explicit stopping conditions.', '- communication state, constructive overlap, refusal, and unresolved shared assumptions;\n- external guidance and its independence;\n- explicit stopping conditions.', 1)
          book = book.replace('- Patience preserves options; it does not excuse endless deferral.\n- External guidance can be non-human; responsibility and authority remain separate.', '- Patience preserves options; it does not excuse endless deferral.\n- Communication searches for constructive overlap while preserving meaningful choice; it does not require unsafe contact or agreement.\n- Threat is modeled as a relation and projected consequence, not automatically as an inherent moral identity.\n- External guidance can be non-human; responsibility and authority remain separate.', 1)

          defs_marker = '| **External guidance** | Information or structure from outside the currently active reasoning loop used to test, constrain, or redirect the model. |'
          defs_insert = '| **Constructive overlap** | A represented set of futures that satisfies the declared hard conditions and meaningful agency requirements of all participating sides in the selected common projection. |\n| **Communication path** | An exchange process intended to resolve variables that can change the represented compatibility of future states, while preserving safety and meaningful refusal. |\n| **Coexistence path** | A constructive future that can include cooperation, repair, bounded separation, non-interference, or another continuation that preserves declared hard conditions without requiring identical goals. |\n'
          assert defs_marker in book
          book = book.replace(defs_marker, defs_insert + defs_marker, 1)

          edge_marker = '| Human responsibility with automated guidance | Preserve the responsible human/role explicitly where law, policy, or safety assigns responsibility; do not transfer it merely because a tool generated the recommendation. |'
          edge_insert = '\n| Threat interpreted as inherent evil | Keep threat as a relation between states/actions and boundaries; test constructive futures before making broader moral claims. |\n| Constructive overlap appears empty | Distinguish verified empty from unresolved/poorly projected; include safe separation and non-interaction as possible constructive futures. |\n| Communication is refused | Respect refusal; preserve safety and move to separation, containment, or other admissible action rather than coercing dialogue. |\n| Communication itself is unsafe | Hard safety/viability constraints override keeping the channel open; use indirect, delayed, mediated, or no-contact paths as appropriate. |\n| Offered choices are not real | Do not count coercive or deceptive alternatives as preserved freedom of choice. |\n| Message sent but not grounded | Do not update shared state until there is sufficient evidence of mutual understanding for the current purpose. |\n| Flexible behavior mistaken for identity loss | Re-check selected invariants and tolerances; tactical change can preserve identity and core principles. |'
          assert edge_marker in book
          book = book.replace(edge_marker, edge_marker + edge_insert, 1)

          map_anchor = '- metacognition and confidence calibration: [R18]'
          assert map_anchor in book
          book = book.replace(map_anchor, map_anchor + '\n' + ref_map.strip(), 1)
          ref_anchor = '**[R18] Fleming, Stephen M.** "Metacognition and Confidence: A Review and Synthesis." *Annual Review of Psychology* 75 (2024). DOI: 10.1146/annurev-psych-022423-032425. https://pubmed.ncbi.nlm.nih.gov/37722748/'
          assert ref_anchor in book
          book = book.replace(ref_anchor, ref_anchor + '\n' + new_refs.strip(), 1)

          book = book.replace('The crew sometimes idled rather than deleting uncertain routes. Fog made outside guidance useful. Weather made the return route relevant.', 'The crew sometimes idled rather than deleting uncertain routes. Another vessel crossed the projected path, and communication revealed that apparent conflict did not exhaust the future space. Fog made outside guidance useful. Weather made the return route relevant.', 1)
          book = book.replace('evidence, uncertainty, future projections, intervention, preservation, patience, guidance, and revision.', 'evidence, uncertainty, future projections, intervention, preservation, patience, communication, coexistence, guidance, and revision.', 1)
          book = book.replace('question, evidence, model, boundary, uncertainty, preserved alternatives, preservation conditions, guidance, and next justified step visible at the same time', 'question, evidence, model, boundary, uncertainty, preserved alternatives, communication space, preservation conditions, guidance, and next justified step visible at the same time', 1)

          assert 'external_guidance:\n' in state
          state = state.replace('external_guidance:\n', state_snip + 'external_guidance:\n', 1)
          state = state.replace('  external_guidance_independence_checked: false\n', '  constructive_overlap_checked_when_relevant: false\n  communication_refusal_respected: false\n  communication_safety_checked: false\n  communication_common_ground_checked: false\n  threat_not_equated_with_inherent_essence: false\n  meaningful_choice_preserved_when_communication_used: false\n  safe_separation_considered_when_needed: false\n  external_guidance_independence_checked: false\n', 1)

          card = card.replace('12. **Review guidance** — scope, independence, calibration, authority, responsibility.\n13. **Choose one bounded step**', '12. **Communicate when relevant** — model threat as a relation; search grounded constructive overlap; preserve meaningful choice and refusal; keep independent safety paths.\n13. **Review guidance** — scope, independence, calibration, authority, responsibility.\n14. **Choose one bounded step**', 1)
          card = card.replace('14. **Run preservation/rescue check** — include non-action when strict preservation is unavailable.\n15. **Execute one justified step** — do not execute the whole imagined route.\n16. **Compare realization with projection** — record residuals and contradictions.\n17. **Update and compress** — retain hard constraints, rare branches, provenance, parked alternatives, recovery state, and variable history.\n18. **Stop explicitly** — named terminal state only.', '15. **Run preservation/rescue check** — include non-action when strict preservation is unavailable.\n16. **Execute one justified step** — do not execute the whole imagined route.\n17. **Compare realization with projection** — record residuals and contradictions.\n18. **Update and compress** — retain hard constraints, rare branches, provenance, parked alternatives, communication state, recovery state, and variable history.\n19. **Stop explicitly** — named terminal state only.', 1)
          assert '## External guidance\n' in card
          card = card.replace('## External guidance\n', card_snip + '## External guidance\n', 1)
          card = card.replace('evidence, model, preserved alternatives, and ability to correct course.', 'evidence, model, preserved alternatives, communication space, and ability to correct course.', 1)

          book_path.write_text(book, encoding='utf-8')
          state_path.write_text(state, encoding='utf-8')
          card_path.write_text(card, encoding='utf-8')

          assert book.count('<a id="c7"></a>') == 1
          assert book.count('<a id="c8"></a>') == 1
          assert book.count('<a id="c9"></a>') == 1
          assert book.count('<a id="c10"></a>') == 1
          assert book.count('<a id="c11"></a>') == 1
          assert '# C7 · The Channel Between Two Lights' in book
          assert '# C11 · The Compass' in book
          assert 'C1–C11' in book
          assert '[R24]' in book
          assert 'communication:' in state
          assert '## Communication / coexistence' in card
          PY

      - name: Commit final integrated volume
        shell: bash
        run: |
          rm -f .github/workflows/compass-integrate.yml
          rm -f COMMUNICATION_COEXISTENCE_NOTE.md COMMUNICATION_CHAPTER_BODY.md COMMUNICATION_REFS_APPEND.md COMMUNICATION_STATE_SNIPPET.yaml COMMUNICATION_CARD_SNIPPET.md
          git config user.name "Nikita Beregovykh"
          git config user.email "116811305+nvberegovykh@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize Compass communication, coexistence, and preserved choice"
          git push origin HEAD:vol-1.2-observers-notes-extension-1
