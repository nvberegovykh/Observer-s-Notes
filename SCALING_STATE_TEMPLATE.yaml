version: "1.3-SD1"
protocol: "Observer's Notes scaling discipline"
status: "candidate cross-cutting companion"

# Auditable state for a scale transition.
# This does not replace COMPASS_STATE_TEMPLATE.yaml; use it when a change in
# count, time, authority, capability, resolution, connectivity, population,
# organizational extent, or another scale dimension can alter the model.
# Record external state only; this is not a request for private chain-of-thought.

